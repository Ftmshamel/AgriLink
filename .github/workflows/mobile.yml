name: Mobile app

on:
  push:
    paths:
      - 'mobile/**'
      - 'site/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  # Build a fresh APK by hand, e.g. after changing the secrets below.
  workflow_dispatch:

jobs:
  check:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # No keystore on CI, so this signs with the debug key. Payment and
      # email settings come from the repository's Actions secrets; any that
      # are not set stay empty and the app falls back to its offline modes
      # (manual reference numbers, demo wallet funds, reset code on screen).
      - name: Build release APK
        env:
          PAYMENTS_URL: ${{ secrets.AGRILINK_PAYMENTS_URL }}
          PAYMENTS_TOKEN: ${{ secrets.AGRILINK_PAYMENTS_TOKEN }}
          GCASH_NUMBER: ${{ secrets.AGRILINK_GCASH_NUMBER }}
          EMAIL_PROVIDER: ${{ secrets.AGRILINK_EMAIL_PROVIDER }}
          EMAIL_API_KEY: ${{ secrets.AGRILINK_EMAIL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.AGRILINK_EMAIL_SENDER }}
          EMAILJS_SERVICE_ID: ${{ secrets.AGRILINK_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.AGRILINK_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.AGRILINK_EMAILJS_PUBLIC_KEY }}
        # Only settings that are set are passed: an empty --dart-define would
        # replace the app's own default (the sender address, for one).
        run: |
          args=()
          add() { if [ -n "$2" ]; then args+=("--dart-define=$1=$2"); fi; }
          add AGRILINK_PAYMENTS_URL "$PAYMENTS_URL"
          add AGRILINK_PAYMENTS_TOKEN "$PAYMENTS_TOKEN"
          add AGRILINK_GCASH_NUMBER "$GCASH_NUMBER"
          add AGRILINK_EMAIL_PROVIDER "$EMAIL_PROVIDER"
          add AGRILINK_EMAIL_API_KEY "$EMAIL_API_KEY"
          add AGRILINK_EMAIL_SENDER "$EMAIL_SENDER"
          add AGRILINK_EMAILJS_SERVICE_ID "$EMAILJS_SERVICE_ID"
          add AGRILINK_EMAILJS_TEMPLATE_ID "$EMAILJS_TEMPLATE_ID"
          add AGRILINK_EMAILJS_PUBLIC_KEY "$EMAILJS_PUBLIC_KEY"
          flutter build apk --release "${args[@]}"

      - name: Report which services this build includes
        run: |
          for name in PAYMENTS_URL EMAIL_PROVIDER EMAIL_API_KEY EMAIL_SENDER GCASH_NUMBER; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: not set"; fi
          done
        env:
          PAYMENTS_URL: ${{ secrets.AGRILINK_PAYMENTS_URL }}
          EMAIL_PROVIDER: ${{ secrets.AGRILINK_EMAIL_PROVIDER }}
          EMAIL_API_KEY: ${{ secrets.AGRILINK_EMAIL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.AGRILINK_EMAIL_SENDER }}
          GCASH_NUMBER: ${{ secrets.AGRILINK_GCASH_NUMBER }}

      - uses: actions/upload-artifact@v4
        with:
          name: agrilink-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Every build of main replaces the APK on one fixed release, so the link
  # and QR code on the download page always give the newest app.
  publish:
    name: Publish APK and download page
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agrilink-apk

      - name: Update the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk AgriLink.apk
          notes="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download AgriLink.apk below, or scan the QR code at https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$notes"
          else
            gh release create apk-latest --title "AgriLink for Android (latest)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload apk-latest AgriLink.apk --clobber

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: pages
        uses: actions/deploy-pages@v4
